plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.muyinteresante'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.rodrigosambade.noticias.publico"
        minSdkVersion 16
        targetSdkVersion 35
        versionCode 18
        versionName "1.1.16"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // La aplicación mantiene las Support Libraries por compatibilidad y el icono
    // WebP existente se conserva para no cambiar el alcance de esta actualización.
    lint {
        disable += ['GradleCompatible', 'WebpUnsupported']
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}
