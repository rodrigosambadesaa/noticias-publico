name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# CVE-2026-114938: disable vulnerable intrinsic in build JVM.
env:
  JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew --no-daemon clean assembleDebug assembleRelease
